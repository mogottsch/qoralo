[project]
name = "mobile-preview-inflect-nano-v1"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "g2p-en==2.1.0",
  "numba==0.61.0",
  "numpy==2.1.3",
  "soundfile==0.13.1",
  "torch==2.6.0+cpu",
  "torchaudio==2.6.0+cpu",
  "transformers==4.48.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
